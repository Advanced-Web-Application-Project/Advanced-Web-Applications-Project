apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-frontend
  template:
    metadata:
      labels:
        app: admin-frontend
    spec:
      containers:
        - name: admin-frontend
          image: image-registry.openshift-image-registry.svc:5000/awap-rio/adminfrontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080