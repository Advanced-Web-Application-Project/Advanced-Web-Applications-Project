version: "3.8"
services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - FRONTEND_URL=http://localhost:8080

  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the PostgreSQL 18 example}
      - POSTGRES_DB=appdb
      - PGDATA=/var/lib/postgresql/18/docker
    # Fresh version 18 storage; upgrade/restore old data separately before adoption.
    volumes:
      - postgres18-data:/var/lib/postgresql
    ports:
      - "5432:5432"

volumes:
  postgres18-data:
